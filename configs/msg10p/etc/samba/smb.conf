[global]
	workgroup = WORKGROUP
	server string = msg10p
	security = user
	passdb backend = tdbsam
	log level = 0
	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes

	# --- 전송 성능 (10GbE) ---
	# 신뢰된 사설망이므로 서명 비활성. SMB3 서명은 CPU를 크게 먹어 10G에서 병목이 된다.
	server signing = disabled
	server min protocol = SMB3_00
	min receivefile size = 16384
	strict sync = no
	use sendfile = yes
	deadtime = 30
	socket options = TCP_NODELAY IPTOS_LOWDELAY
	# 단일 스트림으로도 8.3Gbps가 나와 효과는 제한적이지만, 다중 클라이언트/병렬
	# 전송에서 이득이 있고 비용이 없어 켜둔다. (ConnectX-3는 RSS 4큐 지원)
	server multi channel support = yes
	aio read size = 1
	aio write size = 1

	# --- ZFS ---
	# strict allocate = yes 는 sparse/CoW 이점을 없애고 불필요한 쓰기를 만든다. 금물.
	strict allocate = no
	# 이름 조회마다 디렉터리를 훑는 대소문자 무시 매칭을 피한다.
	# ZFS 가 casesensitivity=sensitive 이므로 의미도 일치한다.
	case sensitive = yes
	strict locking = no

	# --- macOS 클라이언트 ---
	# 순서 중요: catia → fruit → streams_xattr
	# fruit:metadata 는 데이터를 쓰기 시작한 뒤 바꾸면 메타데이터가 유실되므로 고정.
	vfs objects = catia fruit streams_xattr
	fruit:metadata = stream
	fruit:model = MacSamba
	fruit:posix_rename = yes
	fruit:veto_appledouble = no
	fruit:nfs_aces = no
	fruit:wipe_intentionally_left_blank_rfork = yes
	fruit:delete_empty_adfiles = yes
	# Mac 메타데이터를 디렉터리 열거 응답에 실어 파일별 왕복을 줄인다
	fruit:readdir_attr = yes
	ea support = yes
	spotlight = no

[zpool]
	path = /zpool
	valid users = zihado
	read only = no
	browseable = yes

[zpool2]
	path = /zpool2
	valid users = zihado
	read only = no
	browseable = yes
