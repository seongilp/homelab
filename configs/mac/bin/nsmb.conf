# macOS SMB 클라이언트 튜닝 — 2026-08-04 NFS→SMB 전환
[default]
# 신뢰된 LAN이므로 서명 비활성. SMB3 서명은 CPU를 크게 먹어 처리량을 떨어뜨린다.
signing_required=no
# SMB3만 사용 (1=SMB1, 2=SMB2, 4=SMB3)
protocol_vers_map=4
# 디렉터리 변경 알림 끔 — 사진 폴더처럼 항목이 많은 곳에서 불필요한 트래픽을 줄인다
notify_off=yes
# 디렉터리 캐시 (기본보다 크게)
dir_cache_max=600
dir_cache_min=30
